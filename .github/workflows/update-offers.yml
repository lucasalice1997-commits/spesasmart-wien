name: Aggiorna offerte
on:
  schedule:
    - cron: '0 5 * * 1,3,4,5'
  workflow_dispatch:
  push:
    paths: ['volantini/**']
permissions:
  contents: write
concurrency:
  group: update-offers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Controlla la chiave API
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Chiave ANTHROPIC_API_KEY non impostata: aggiornamento automatico saltato (vedi LEGGIMI.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.key.outputs.ok == 'true'
        run: pip install anthropic
      - if: steps.key.outputs.ok == 'true'
        run: python pipeline/update_offers.py
      - name: Salva le offerte
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          git config user.name "nocciola-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A offers.json pipeline/processed.json volantini
          git diff --cached --quiet || (git commit -m "Aggiorna offerte" && git push)
